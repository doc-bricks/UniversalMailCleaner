[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universalmailcleaner"
version = "1.2.0"
description = "Local-first Windows desktop app for cleaning IMAP and Gmail mailboxes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [
    { name = "Lukas Geiger" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
]
keywords = [
    "desktop-app",
    "email",
    "email-management",
    "imap",
    "pyside6",
    "mail-cleaner",
    "email-cleanup",
    "gmail-api",
    "gmail-cleaner",
    "local-first",
    "oauth2",
    "privacy-first",
    "scheduler",
    "imap-cleaner",
    "large-email-finder",
    "mailbox-cleaner",
    "mailbox-cleanup",
    "safe-delete",
    "gmail-cleanup",
    "inbox-cleanup",
]
dependencies = [
    "PySide6>=6.5.0,<7.0.0",
    "keyring>=23.0.0,<26.0.0",
    "google-auth-oauthlib>=1.0.0,<2.0.0",
    "google-api-python-client>=2.0.0,<3.0.0",
]

[project.gui-scripts]
universalmailcleaner = "mail_imap_cleaner_v1:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "Pillow>=10.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/doc-bricks/UniversalMailCleaner"
Repository = "https://github.com/doc-bricks/UniversalMailCleaner"
Documentation = "https://github.com/doc-bricks/UniversalMailCleaner#readme"
Contributing = "https://github.com/doc-bricks/UniversalMailCleaner/blob/master/CONTRIBUTING.md"
Changelog = "https://github.com/doc-bricks/UniversalMailCleaner/blob/master/CHANGELOG.md"
Notice = "https://github.com/doc-bricks/UniversalMailCleaner/blob/master/NOTICE"
"Plain-Text License" = "https://github.com/doc-bricks/UniversalMailCleaner/blob/master/LICENSE"
"Third-Party Licenses" = "https://github.com/doc-bricks/UniversalMailCleaner/blob/master/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/doc-bricks/UniversalMailCleaner/blob/master/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/doc-bricks/UniversalMailCleaner/blob/master/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/doc-bricks/UniversalMailCleaner/blob/master/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/doc-bricks/UniversalMailCleaner/blob/master/llms.txt"
"Security Policy" = "https://github.com/doc-bricks/UniversalMailCleaner/blob/master/SECURITY.md"
Issues = "https://github.com/doc-bricks/UniversalMailCleaner/issues"
"Bug Tracker" = "https://github.com/doc-bricks/UniversalMailCleaner/issues"
"Parent Organization" = "https://github.com/doc-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.setuptools]
py-modules = [
    "gmail_service",
    "imap_client",
    "mail_imap_cleaner_v1",
    "models",
    "profile_exchange",
    "scheduler_widget",
    "workers",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra -v --basetemp=.pytest_temp"
norecursedirs = [
    ".git",
    ".pytest_cache",
    ".pytest_temp",
    ".pytest_tmp*",
    ".hypothesis",
    ".turbo",
    ".tox",
    "build",
    "dist",
    "venv",
    ".venv",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C4"]
ignore = ["E501", "E701", "E702", "E741", "E402"]
